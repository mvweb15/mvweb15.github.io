<article class="post-card">
  <h2 class="post-card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
  <p class="post-card__excerpt">
    {{ include.post.excerpt | strip_html | truncatewords: 40 }}
    <a class="post-card__more" href="{{ include.post.url | relative_url }}">&raquo;</a>
  </p>
  <div class="post-card__meta">
    <img class="post-card__avatar" src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="{{ site.author }}">
    <span class="post-card__by">
      {{ site.author }} on
      {% if include.post.tags.first %}
        <a href="{{ site.baseurl }}/tag/{{ include.post.tags.first | slugify }}/">{{ include.post.tags.first | capitalize }}</a>
      {% else %}
        Genel
      {% endif %}
    </span>
    <span class="post-card__divider">|</span>
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%d %b %Y" | upcase }}</time>
  </div>
</article>
